# Installed when the checker/feed components are enabled. The base unit keeps
# CAP_NET_ADMIN available to launch; launch drops it for dry_run/soft_block and
# retains it only when effective rule actions need nftables access.
[Service]
SupplementaryGroups=antiddos-soft-feed
Environment=ANTIDDOS_SOFT_BLOCK_ENABLED=1
ReadWritePaths=/run/antiddos-soft-feed
RuntimeDirectory=antiddos-soft-feed
RuntimeDirectoryMode=0750
